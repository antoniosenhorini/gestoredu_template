{% if mostrar_aviso_senha_padrao %}
<div class="alert alert-warning border-warning shadow-sm mb-4" role="alert">
    <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3">
        <div>
            <h2 class="h5 mb-1">
                <i class="fas fa-triangle-exclamation me-2"></i>Por seguranca, altere sua senha pessoal.
            </h2>
            <p class="mb-0">Voce ainda esta usando a senha padrao. Crie uma senha propria para proteger sua conta.</p>
        </div>
        <div class="d-flex flex-column flex-sm-row gap-2">
            <a href="{% url 'alterar_senha' %}" class="btn btn-primary">
                <i class="fas fa-key me-1"></i>Alterar minha senha
            </a>
            <a href="{% url 'recuperar_senha' %}" class="btn btn-outline-dark">
                <i class="fas fa-unlock-keyhole me-1"></i>Recuperar senha
            </a>
        </div>
    </div>
</div>
{% endif %}
