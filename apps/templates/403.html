{% extends 'base.html' %}

{% block title %}Acesso negado{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body text-center p-4 p-md-5">
                    <div class="display-5 text-danger mb-3">
                        <i class="fas fa-lock"></i>
                    </div>
                    <h1 class="h3 mb-3">Acesso negado</h1>
                    <p class="text-muted mb-4">
                        Seu usu&aacute;rio n&atilde;o tem permiss&atilde;o para acessar esta &aacute;rea do sistema.
                    </p>
                    <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
                        <a href="{% url 'home' %}" class="btn btn-primary">
                            <i class="fas fa-home me-1"></i>Ir para o in&iacute;cio
                        </a>
                        {% if permissoes.pode_acessar_painel %}
                            <a href="{% url 'painel_equipe' %}" class="btn btn-outline-secondary">
                                <i class="fas fa-gauge-high me-1"></i>Painel da Equipe
                            </a>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
