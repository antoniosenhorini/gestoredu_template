<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Cronograma do Professor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: #f5f8fc;
            color: #1f2937;
        }

        .public-schedule-page {
            min-height: 100vh;
        }

        .public-schedule-shell {
            max-width: 1120px;
        }

        .public-schedule-header {
            border-bottom: 1px solid #dbeafe;
            padding: 1.25rem 0;
        }

        .public-schedule-panel {
            background: #fff;
            border: 1px solid #dbeafe;
            border-radius: 8px;
            box-shadow: 0 8px 22px rgba(15, 47, 89, 0.08);
        }

        .maintenance-icon {
            width: 4rem;
            height: 4rem;
            font-size: 1.75rem;
        }

        @media (max-width: 575.98px) {
            .public-schedule-header h1 {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="public-schedule-page">
        <header class="public-schedule-header bg-white">
            <div class="container public-schedule-shell">
                <div class="d-flex align-items-center gap-3">
                    <span class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary-subtle text-primary" style="width: 2.75rem; height: 2.75rem;">
                        <i class="fas fa-calendar-days"></i>
                    </span>
                    <div>
                        <h1 class="h3 mb-1">Consultar Cronograma do Professor</h1>
                        <p class="text-muted mb-0">Horários de laboratório por professor</p>
                    </div>
                </div>
            </div>
        </header>

        <main class="container public-schedule-shell py-5">
            <section class="public-schedule-panel p-4 p-md-5 text-center mx-auto" style="max-width: 640px;">
                <span class="maintenance-icon d-inline-flex align-items-center justify-content-center rounded-circle bg-warning-subtle text-warning-emphasis mb-3">
                    <i class="fas fa-tools"></i>
                </span>
                <h2 class="h4 mb-3">Sistema em manutenção</h2>
                <p class="text-muted mb-0">
                    A consulta de horários dos laboratórios está temporariamente indisponível para atualização.
                    Tente novamente mais tarde.
                </p>
            </section>
        </main>
    </div>
</body>
</html>
