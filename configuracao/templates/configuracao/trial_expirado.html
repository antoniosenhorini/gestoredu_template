<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Acesso Expirado — ERP Escolar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        h1 {
            color: #c0392b;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #2980b9;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .btn:hover {
            background: #21618c;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>⏰ Acesso Expirado</h1>
        <p>O período de teste do sistema expirou.</p>
        <p>Entre em contato com o administrador para renovar o acesso.</p>
        <a href="/login/" class="btn">Fazer Login</a>
    </div>
</body>
</html>
